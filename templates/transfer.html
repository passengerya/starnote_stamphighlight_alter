<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>矩形注释转移 | PDF Helper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* DESIGN SYSTEM: "Fluid Pop v3" (Copied from index.html) */
    :root {
      --c-blue: #4285F4;
      --c-red: #EA4335;
      --c-yellow: #FBBC05;
      --c-green: #34A853;
      
      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1); 
      --ease-smooth: cubic-bezier(0.2, 0.8, 0.2, 1);    
    }

    :root[data-theme="dark"] {
      --bg-deep: #050505;
      --glass-surface: rgba(30, 30, 35, 0.70);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.05);
      --text-main: #FFFFFF;
      --text-sub: rgba(255, 255, 255, 0.55);
      --input-fill: rgba(0, 0, 0, 0.4);
      --card-base: rgba(255, 255, 255, 0.06);
      --scroll-thumb: rgba(255, 255, 255, 0.2);
    }

    :root[data-theme="light"] {
      --bg-deep: #F2F2F7;
      --glass-surface: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-highlight: rgba(255, 255, 255, 0.4);
      --text-main: #1D1D1F;
      --text-sub: rgba(0, 0, 0, 0.5);
      --input-fill: rgba(0, 0, 0, 0.05);
      --card-base: #FFFFFF;
      --scroll-thumb: rgba(0, 0, 0, 0.15);
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0; padding: 0;
      background: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      transition: background 0.5s var(--ease-smooth);
      overflow-x: hidden;
    }

    .ambient-glow {
      position: fixed; width: 100vw; height: 100vh; top: 0; left: 0; z-index: -1;
      background: 
        radial-gradient(circle at 20% 20%, rgba(66, 133, 244, 0.15), transparent 50%),
        radial-gradient(circle at 80% 30%, rgba(234, 67, 53, 0.12), transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(52, 168, 83, 0.12), transparent 60%),
        radial-gradient(circle at 70% 90%, rgba(251, 188, 5, 0.12), transparent 50%);
      filter: blur(100px); pointer-events: none;
    }

    .container {
      width: 92vw; max-width: 92vw; margin: 0 auto; 
      padding: 40px 0; display: flex; flex-direction: column; gap: 24px;
    }

    .glass-panel {
      background: var(--glass-surface);
      backdrop-filter: blur(30px) saturate(140%);
      -webkit-backdrop-filter: blur(30px) saturate(140%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 1px 0 inset var(--glass-highlight), 0 24px 48px -12px rgba(0,0,0,0.1);
      border-radius: 28px;
      padding: 32px;
      position: relative;
      transition: transform 0.3s var(--ease-smooth);
      width: 100%;
    }

    .header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
    h1 {
      font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--c-blue), var(--c-red));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .chip-link { 
      color:var(--text-sub); text-decoration:none; font-weight:600; padding:10px 14px; 
      border:1px solid var(--glass-border); border-radius:14px; background:var(--card-base); 
      display:inline-flex; align-items:center; gap:8px; font-size: 14px;
      transition: all 0.2s var(--ease-smooth);
    }
    .chip-link:hover { color:var(--text-main); background: var(--glass-highlight); transform: translateY(-1px); }

    .action-bar { 
      display: flex; gap: 16px; align-items: center; width: 100%; 
      flex-wrap: wrap; 
    }
    
    .input-pill {
      background: var(--input-fill); border: 1px solid transparent;
      height: 52px; padding: 0 20px; border-radius: 99px;
      color: var(--text-main); font-family: inherit; font-size: 14px;
      flex: 1; min-width: 200px;
      transition: all 0.3s var(--ease-smooth);
    }
    .input-pill:focus { 
      background: var(--bg-deep); border-color: var(--c-blue); 
      box-shadow: 0 0 0 4px rgba(66, 133, 244, 0.25); outline: none; transform: translateY(-1px);
    }
    .input-pill:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn {
      border: none; padding: 0 24px; height: 52px; border-radius: 99px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      position: relative; overflow: hidden; white-space: nowrap;
      transition: all 0.4s var(--ease-elastic);
      flex-shrink: 0;
    }
    .btn:hover:not(:disabled) { transform: translateY(-3px) scale(1.03); }
    .btn:active:not(:disabled) { transform: translateY(1px) scale(0.95); transition-duration: 0.1s; }

    .btn-primary {
      background: linear-gradient(135deg, var(--c-blue), #3b78e7); color: white;
      box-shadow: 0 8px 20px -6px rgba(66, 133, 244, 0.4), 0 2px 4px -1px rgba(66, 133, 244, 0.2) inset;
    }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 16px 32px -8px rgba(66, 133, 244, 0.6), 0 4px 8px -2px rgba(255, 255, 255, 0.2) inset; }

    .btn-secondary { background: var(--input-fill); color: var(--text-main); border: 1px solid transparent; }
    .btn-secondary:hover:not(:disabled) { background: var(--glass-border); border-color: rgba(255,255,255,0.1); box-shadow: 0 8px 24px -6px rgba(0,0,0,0.15); }
    
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; filter: grayscale(0.8); }

    .btn-transfer-ready {
      background: linear-gradient(135deg, var(--c-green), #2d9147) !important; color: white !important;
      box-shadow: 0 8px 20px -6px rgba(52, 168, 83, 0.4) !important;
    }
    .btn-transfer-ready:hover:not(:disabled) { box-shadow: 0 16px 32px -8px rgba(52, 168, 83, 0.6) !important; }

    .icon-btn {
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid var(--glass-border); background: var(--card-base); color: var(--text-main);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: all 0.4s var(--ease-elastic);
    }
    .icon-btn:hover { transform: rotate(20deg) scale(1.15); background: var(--text-main); color: var(--bg-deep); }
    .icon-btn:active { transform: scale(0.9); }

    .status-bar {
      margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--glass-border);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; color: var(--text-sub); width: 100%;
    }
    .file-tag {
      background: var(--card-base); padding: 6px 12px; border-radius: 10px;
      color: var(--text-main); font-weight: 500; display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid var(--glass-border);
    }

    /* Preview Layout */
    .preview-layout { display: flex; gap: 24px; width: 100%; }
    .preview-section { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    
    .section-title {
      font-size: 15px; font-weight: 600; margin-bottom: 16px;
      color: var(--text-sub); display: flex; justify-content: space-between; padding: 0 4px;
    }

    .grid-scroller {
      max-height: 75vh; min-height: 400px;
      overflow-y: auto; overflow-x: hidden;
      padding-right: 8px; padding-bottom: 8px; padding-top: 4px; padding-left: 4px;
      scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent;
    }
    .grid-scroller::-webkit-scrollbar { width: 8px; }
    .grid-scroller::-webkit-scrollbar-track { background: transparent; }
    .grid-scroller::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; }

    .grid-container {
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
      gap: 20px; 
    }

    .card {
      background: var(--card-base); border-radius: 18px; padding: 10px;
      position: relative; cursor: pointer; border: 2px solid transparent;
      transition: all 0.3s var(--ease-elastic);
    }
    .card canvas { width: 100%; height: auto; display: block; border-radius: 12px; transition: opacity 0.2s; }
    .card:hover {
      background: var(--glass-highlight); transform: translateY(-6px) scale(1.05);
      box-shadow: 0 16px 30px -10px rgba(0,0,0,0.2); z-index: 2;
    }
    .card:active { transform: scale(0.95); }

    .card.selected { border-color: var(--c-blue); background: rgba(66, 133, 244, 0.08); box-shadow: 0 0 0 4px rgba(66, 133, 244, 0.15); }
    .card.target-selected { border-color: var(--c-green); background: rgba(52, 168, 83, 0.08); box-shadow: 0 0 0 4px rgba(52, 168, 83, 0.15); }

    .badge {
      position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 50%;
      background: var(--c-blue); color: white; display: flex; align-items: center; justify-content: center;
      transform: scale(0); transition: transform 0.4s var(--ease-elastic);
      z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      font-size: 11px; font-weight: 700;
    }
    .card.selected .badge { transform: scale(1); }
    .target-badge { background: var(--c-green); }
    .card.target-selected .badge { transform: scale(1); }
    
    .card-label { text-align: center; font-size: 12px; margin-top: 10px; color: var(--text-sub); font-weight: 600; }
    .card.selected .card-label { color: var(--c-blue); }
    .card.target-selected .card-label { color: var(--c-green); }

    .hidden { display: none !important; }
    input[type="file"] { display: none; }

    /* Context Menu & Full Preview (Same as Index) */
    .context-menu {
      position: fixed; z-index: 3000;
      background: var(--glass-surface); border: 1px solid var(--glass-border);
      border-radius: 14px; padding: 6px; box-shadow: 0 20px 40px -18px rgba(0,0,0,0.4);
      min-width: 160px; backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
    }
    .context-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px; cursor: pointer;
      color: var(--text-main); font-size: 13px; user-select: none;
    }
    .context-item:hover { background: var(--glass-highlight); color: var(--c-blue); }

    .full-preview {
      position: fixed; z-index: 3200;
      background: var(--glass-surface); border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 12px 12px 14px 12px;
      box-shadow: 0 30px 60px -24px rgba(0,0,0,0.45);
      backdrop-filter: blur(22px) saturate(150%);
      -webkit-backdrop-filter: blur(22px) saturate(150%);
      max-width: 70vw; max-height: 85vh; overflow: hidden;
      transition: opacity 0.15s var(--ease-smooth);
    }
    .full-preview.hidden { opacity: 0; pointer-events: none; }
    .full-preview-header {
      font-size: 12px; color: var(--text-sub); margin: 0 0 8px 2px; letter-spacing: 0.02em;
      display: flex; justify-content: space-between; align-items: center;
    }
    .full-preview canvas {
      display: block; width: 100%; height: auto;
      max-height: calc(85vh - 34px); border-radius: 10px; background: var(--bg-deep);
    }

    @media(max-width:860px){ 
      .preview-layout{flex-direction:column;} 
      .input-pill{width:100%;} 
      .action-bar { gap: 12px; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="container">
    <div class="glass-panel">
      <div class="header-row">
        <h1>矩形注释转移</h1>
        <div style="display:flex; gap:10px; align-items:center;">
          <a class="chip-link" href="/">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            返回转换
          </a>
          <button class="icon-btn" id="toggle-theme" title="切换主题">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          </button>
        </div>
      </div>

      <div class="action-bar">
        <label class="btn btn-primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span id="source-name">选择需转移注释 PDF</span>
          <input id="src-file" type="file" accept="application/pdf">
        </label>
        <input id="src-pages" class="input-pill" type="text" placeholder="源页码 (如 1,3,5-7，可空)">
      </div>

      <div style="height: 1px; background: var(--glass-border); margin: 24px 0;"></div>

      <div class="action-bar">
        <label class="btn btn-secondary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 12l8-8M12 12H4m8 0v8"/></svg>
          <span id="target-name">选择转移目标 PDF</span>
          <input id="dst-file" type="file" accept="application/pdf">
        </label>
        <input id="dst-pages" class="input-pill" type="text" placeholder="目标页码 (为空时沿用源页)">
        
        <button id="transfer-btn" class="btn btn-secondary" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
          转移矩形注释
        </button>
      </div>

      <div class="status-bar">
        <div style="display:flex; gap:12px;">
          <div id="tag-src" class="file-tag hidden">
            <span style="width:8px; height:8px; background:var(--c-blue); border-radius:50%"></span>
            <span id="tag-src-name">source.pdf</span>
            <span style="opacity:0.3">|</span>
            <span id="tag-src-count" style="color:var(--text-sub)">0p</span>
          </div>
          <div id="tag-dst" class="file-tag hidden">
            <span style="width:8px; height:8px; background:var(--c-green); border-radius:50%"></span>
            <span id="tag-dst-name">target.pdf</span>
            <span style="opacity:0.3">|</span>
            <span id="tag-dst-count" style="color:var(--text-sub)">0p</span>
          </div>
        </div>
        <div id="status-text">等待文件...</div>
      </div>
    </div>

    <div class="preview-layout">
      <div class="glass-panel preview-section" id="panel-src" style="display:none">
        <div class="section-title">
          <span>需转移注释 PDF 预览</span>
          <span style="color:var(--c-blue)" id="src-hint"></span>
        </div>
        <div class="grid-scroller"><div id="src-grid" class="grid-container"></div></div>
      </div>
      <div class="glass-panel preview-section" id="panel-dst" style="display:none">
        <div class="section-title">
          <span>目标 PDF 预览</span>
          <span style="color:var(--c-green)" id="dst-hint"></span>
        </div>
        <div class="grid-scroller"><div id="dst-grid" class="grid-container"></div></div>
      </div>
    </div>
  </div>

  <div id="context-menu" class="context-menu hidden">
    <div class="context-item" data-action="view-original">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
      <span>查看原图</span>
    </div>
  </div>

  <div id="full-preview" class="full-preview hidden">
    <div class="full-preview-header">
      <span id="full-preview-title">原图</span>
      <span style="opacity:0.6">右键或 Esc 关闭</span>
    </div>
    <canvas id="full-preview-canvas"></canvas>
  </div>

  <script>
    const els = {
      srcFile: document.getElementById('src-file'),
      dstFile: document.getElementById('dst-file'),
      srcName: document.getElementById('source-name'),
      dstName: document.getElementById('target-name'),
      srcPages: document.getElementById('src-pages'),
      dstPages: document.getElementById('dst-pages'),
      transfer: document.getElementById('transfer-btn'),
      status: document.getElementById('status-text'),
      srcGrid: document.getElementById('src-grid'),
      dstGrid: document.getElementById('dst-grid'),
      srcHint: document.getElementById('src-hint'),
      dstHint: document.getElementById('dst-hint'),
      panelSrc: document.getElementById('panel-src'),
      panelDst: document.getElementById('panel-dst'),
      tagSrc: document.getElementById('tag-src'),
      tagDst: document.getElementById('tag-dst'),
      tagSrcName: document.getElementById('tag-src-name'),
      tagDstName: document.getElementById('tag-dst-name'),
      tagSrcCount: document.getElementById('tag-src-count'),
      tagDstCount: document.getElementById('tag-dst-count'),
      contextMenu: document.getElementById('context-menu'),
      contextView: document.querySelector('#context-menu [data-action="view-original"]'),
      fullPreview: document.getElementById('full-preview'),
      fullPreviewCanvas: document.getElementById('full-preview-canvas'),
      fullPreviewTitle: document.getElementById('full-preview-title'),
    };

    // 简化的全局状态：文件、PDF文档实例与选中页集合
    const state = { srcFile:null, dstFile:null, srcDoc:null, dstDoc:null, selSrc:new Set(), selDst:new Set() };
    let contextState = null;

    // 主题与主站保持一致
    (function initTheme() {
      const saved = localStorage.getItem('theme');
      const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersLight ? 'light' : 'dark'));
    })();
    document.getElementById('toggle-theme').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    function updateStatus(msg, type='info'){
      const colors = {info:'var(--text-sub)', error:'var(--c-red)', success:'var(--c-green)', loading: 'var(--text-main)'};
      els.status.textContent = msg;
      els.status.style.color = colors[type] || colors.info;
    }

    function setBtnState(mismatch=false){
      const readyFiles = state.srcFile && state.dstFile && !mismatch;
      const count = currentCount();
      
      els.transfer.disabled = !readyFiles;
      els.transfer.textContent = count > 0 ? `转移注释 (${count}页)` : '转移矩形注释';
      
      if (readyFiles) {
        els.transfer.classList.add('btn-transfer-ready');
        els.transfer.classList.remove('btn-secondary');
      } else {
        els.transfer.classList.remove('btn-transfer-ready');
        els.transfer.classList.add('btn-secondary');
      }
    }

    function parseRange(str, max){
      const out = new Set();
      if(!str) return out;
      str.split(/[,，\s]+/).forEach(part=>{
        if(!part) return;
        if(part.includes('-')){
          const [a,b] = part.split('-').map(Number);
          if(a && b){
            const lo = Math.min(a,b), hi = Math.max(a,b);
            for(let i=lo;i<=hi;i++) if(i<=max) out.add(i);
          }
        }else{
          const n = Number(part);
          if(n && n<=max) out.add(n);
        }
      });
      return out;
    }

    function setToStr(set){ return Array.from(set).sort((a,b)=>a-b).join(', '); }

    // 按主页面逻辑生成缩略卡片并绑定点击/右键事件
    async function renderGrid(doc, container, isTarget){
      container.innerHTML = '';
      for(let i=1;i<=doc.numPages;i++){
        const page = await doc.getPage(i);
        const viewport = page.getViewport({scale:0.15});
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.p = i;
        
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width; canvas.height = viewport.height;
        await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
        
        const badge = document.createElement('div');
        badge.className = isTarget ? 'badge target-badge' : 'badge';
        badge.textContent = i;
        
        const label = document.createElement('div');
        label.className = 'card-label'; label.innerText = i;

        card.appendChild(badge);
        card.appendChild(canvas);
        card.appendChild(label);

        card.addEventListener('click', ()=>{
          const set = isTarget ? state.selDst : state.selSrc;
          if(set.has(i)) set.delete(i); else set.add(i);
          syncSelection(container, set, isTarget);
          if(isTarget) els.dstPages.value = setToStr(set);
          else els.srcPages.value = setToStr(set);
        });
        card.addEventListener('contextmenu', (evt)=>{
          evt.preventDefault();
          const rect = card.getBoundingClientRect();
          showContextMenu(evt, { doc, page: i, label: isTarget ? 'target' : 'source', rect });
        });
        container.appendChild(card);
      }
      syncSelection(container, isTarget?state.selDst:state.selSrc, isTarget);
    }

    function syncSelection(container, set, isTarget){
      for(const card of container.children){
        const p = Number(card.dataset.p);
        const cls = isTarget ? 'target-selected' : 'selected';
        if(set.has(p)) card.classList.add(cls); else card.classList.remove(cls);
      }
      updateHints();
      setBtnState(hasMismatch());
    }

    function controls(enabled){
      els.srcPages.disabled = !enabled;
      els.dstPages.disabled = !enabled;
      els.transfer.disabled = !enabled || !(state.srcFile && state.dstFile);
    }

    els.srcFile.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      state.srcFile = file;
      els.srcName.textContent = file.name;
      els.tagSrcName.textContent = file.name;
      updateStatus('正在解析需转移注释 PDF...', 'loading');
      controls(false);
      try {
        const ab = await file.arrayBuffer();
        state.srcDoc = await pdfjsLib.getDocument({data:ab}).promise;
        state.selSrc.clear();
        els.srcPages.value = '';
        els.srcHint.textContent = `${state.srcDoc.numPages} 页`;
        els.tagSrcCount.textContent = `${state.srcDoc.numPages}p`;
        els.tagSrc.classList.remove('hidden');
        els.panelSrc.style.display = 'flex';
        await renderGrid(state.srcDoc, els.srcGrid, false);
        updateHints();
        updateStatus('源文件已载入', 'success');
        controls(true);
        setBtnState(hasMismatch());
      } catch(err) { updateStatus('源文件解析失败', 'error'); }
    });

    els.dstFile.addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      state.dstFile = file;
      els.dstName.textContent = file.name;
      els.tagDstName.textContent = file.name;
      updateStatus('正在解析目标 PDF...', 'loading');
      controls(false);
      try {
        const ab = await file.arrayBuffer();
        state.dstDoc = await pdfjsLib.getDocument({data:ab}).promise;
        state.selDst.clear();
        els.dstPages.value = '';
        els.dstHint.textContent = `${state.dstDoc.numPages} 页`;
        els.tagDstCount.textContent = `${state.dstDoc.numPages}p`;
        els.tagDst.classList.remove('hidden');
        els.panelDst.style.display = 'flex';
        await renderGrid(state.dstDoc, els.dstGrid, true);
        updateHints();
        updateStatus('目标文件已载入', 'success');
        controls(true);
        setBtnState(hasMismatch());
      } catch(err) { updateStatus('目标文件解析失败', 'error'); }
    });

    els.srcPages.addEventListener('input', ()=>{
      state.selSrc = parseRange(els.srcPages.value, state.srcDoc?.numPages||0);
      syncSelection(els.srcGrid, state.selSrc, false);
      setBtnState(hasMismatch());
    });
    els.dstPages.addEventListener('input', ()=>{
      state.selDst = parseRange(els.dstPages.value, state.dstDoc?.numPages||0);
      syncSelection(els.dstGrid, state.selDst, true);
      setBtnState(hasMismatch());
    });

    // 输入优先，其次使用当前选择集合作为页码字符串
    function normalizePages(inputEl, set){ const t=inputEl.value.trim(); if(t) return t; if(set.size) return setToStr(set); return ''; }

    function currentCount(){
      const rawSrc = normalizePages(els.srcPages, state.selSrc);
      const srcSet = parseRange(rawSrc, state.srcDoc?.numPages || 0);
      return srcSet.size || (state.srcDoc ? state.srcDoc.numPages : 0);
    }

    function hasMismatch(){
      const rawSrc = normalizePages(els.srcPages, state.selSrc);
      const rawDst = normalizePages(els.dstPages, state.selDst);
      const srcSet = parseRange(rawSrc, state.srcDoc?.numPages || 0);
      const dstSet = parseRange(rawDst, state.dstDoc?.numPages || 0);
      return srcSet.size && dstSet.size && srcSet.size !== dstSet.size;
    }

    function updateHints(){
      if(state.srcDoc){
        const extra = state.selSrc.size ? ` · 选中 ${state.selSrc.size} 页` : '';
        els.srcHint.textContent = `${state.srcDoc.numPages} 页${extra}`;
      }
      if(state.dstDoc){
        const extra = state.selDst.size ? ` · 选中 ${state.selDst.size} 页` : '';
        els.dstHint.textContent = `${state.dstDoc.numPages} 页${extra}`;
      }
    }

    function filenameFromDisposition(res, fallback){
      const header = res.headers.get('Content-Disposition') || '';
      const utf8Match = header.match(/filename\\*=UTF-8''([^;]+)/i);
      const plainMatch = header.match(/filename=\"?([^\";]+)\"?/i);
      const name = utf8Match?.[1] || plainMatch?.[1];
      return name ? decodeURIComponent(name) : fallback;
    }

    async function responseToError(res){
      try { const data = await res.clone().json(); if(data?.error) return data.error; } catch(_){}
      try { const text = await res.clone().text(); if(text) return text; } catch(_){}
      return res.statusText || '请求失败';
    }

    function downloadBlob(blob, filename){
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename || 'rect-transfer.pdf'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    }

    els.transfer.addEventListener('click', async ()=>{
      if(!state.srcFile || !state.dstFile) return;
      const rawSrc = normalizePages(els.srcPages, state.selSrc);
      const rawDst = normalizePages(els.dstPages, state.selDst);
      const srcSet = parseRange(rawSrc, state.srcDoc?.numPages || 0);
      const dstSet = parseRange(rawDst, state.dstDoc?.numPages || 0);
      
      if(srcSet.size && dstSet.size && srcSet.size !== dstSet.size){
        updateStatus('源页数与目标页数不匹配，请检查', 'error');
        return;
      }
      
      const srcPagesStr = srcSet.size ? setToStr(srcSet) : '';
      const dstPagesStr = dstSet.size ? setToStr(dstSet) : '';
      
      updateStatus('正在转移矩形注释...', 'loading');
      controls(false);
      const fd = new FormData();
      fd.append('source_file', state.srcFile);
      fd.append('target_file', state.dstFile);
      if(srcPagesStr) fd.append('source_pages', srcPagesStr);
      if(dstPagesStr) fd.append('target_pages', dstPagesStr);
      
      try{
        const res = await fetch('/transfer_rects', {method:'POST', body:fd});
        if(!res.ok) throw new Error(await responseToError(res));
        const blob = await res.blob();
        const name = filenameFromDisposition(res, state.dstFile.name || 'rect-transfer.pdf');
        downloadBlob(blob, name);
        updateStatus('转移完成，已开始下载', 'success');
      }catch(err){
        console.error(err);
        updateStatus(err?.message || '转移失败', 'error');
      }finally{
        controls(true);
        setBtnState(hasMismatch());
      }
    });

    function showContextMenu(evt, info) {
      contextState = info;
      els.contextMenu.classList.remove('hidden');
      const rect = els.contextMenu.getBoundingClientRect();
      const left = Math.min(evt.clientX, window.innerWidth - rect.width - 8);
      const top = Math.min(evt.clientY, window.innerHeight - rect.height - 8);
      els.contextMenu.style.left = `${left}px`;
      els.contextMenu.style.top = `${top}px`;
    }

    function hideContextMenu() {
      els.contextMenu.classList.add('hidden');
      contextState = null;
    }

    async function viewOriginalPage() {
      if (!contextState?.doc || !contextState?.page) return;
      const rect = contextState.rect;
      try {
        const pdfPage = await contextState.doc.getPage(contextState.page);
        const maxW = Math.min(window.innerWidth * 0.7, 960);
        const maxH = Math.min(window.innerHeight * 0.85, 1100);
        const baseViewport = pdfPage.getViewport({ scale: 1 });
        const scale = Math.max(1.2, Math.min(maxW / baseViewport.width, maxH / baseViewport.height));
        const viewport = pdfPage.getViewport({ scale });

        const canvas = els.fullPreviewCanvas;
        const ctx = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await pdfPage.render({ canvasContext: ctx, viewport }).promise;

        els.fullPreviewTitle.textContent = `${contextState.label || 'page'} ${contextState.page}`;
        positionFullPreview(rect, canvas.width, canvas.height);
        els.fullPreview.classList.remove('hidden');
      } catch (err) {
        console.error(err);
      }
      hideContextMenu();
    }

    function positionFullPreview(targetRect, previewW, previewH) {
      const pad = 14;
      const headerH = 30;
      const panelW = Math.min(previewW + pad * 2, window.innerWidth * 0.7);
      const panelH = Math.min(previewH + pad * 2 + headerH, window.innerHeight * 0.85);

      let left = targetRect ? targetRect.left - pad : (window.innerWidth - panelW) / 2;
      let top = targetRect ? targetRect.top - pad : (window.innerHeight - panelH) / 2;

      left = Math.max(12, Math.min(left, window.innerWidth - panelW - 12));
      top = Math.max(12, Math.min(top, window.innerHeight - panelH - 12));

      els.fullPreview.style.left = `${left}px`;
      els.fullPreview.style.top = `${top}px`;
      els.fullPreview.style.width = `${panelW}px`;
    }

    function hideFullPreview() {
      els.fullPreview.classList.add('hidden');
    }

    els.contextView.addEventListener('click', viewOriginalPage);
    document.addEventListener('click', (evt) => {
      if (!evt.target.closest('#context-menu')) hideContextMenu();
      if (!evt.target.closest('#full-preview')) hideFullPreview();
    });
    els.fullPreview.addEventListener('contextmenu', (evt) => {
      evt.preventDefault();
      hideFullPreview();
      hideContextMenu();
    });
    document.addEventListener('contextmenu', (evt) => { if (!evt.target.closest('.card')) hideContextMenu(); });
    window.addEventListener('resize', () => { hideContextMenu(); hideFullPreview(); });
    window.addEventListener('scroll', hideFullPreview, { passive: true });
    document.addEventListener('keydown', (evt) => { if (evt.key === 'Escape') { hideContextMenu(); hideFullPreview(); } });
  </script>
</body>
</html>
