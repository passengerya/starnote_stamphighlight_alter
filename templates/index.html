<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>PDF Stamp → Highlight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* DESIGN SYSTEM: "Fluid Pop v3 - Balanced Immersion" */
    :root {
      --c-blue: #4285F4;
      --c-red: #EA4335;
      --c-yellow: #FBBC05;
      --c-green: #34A853;
      
      --ease-elastic: cubic-bezier(0.34, 1.56, 0.64, 1); 
      --ease-smooth: cubic-bezier(0.2, 0.8, 0.2, 1);    
    }

    :root[data-theme="dark"] {
      --bg-deep: #050505;
      --glass-surface: rgba(30, 30, 35, 0.70);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-highlight: rgba(255, 255, 255, 0.05);
      --text-main: #FFFFFF;
      --text-sub: rgba(255, 255, 255, 0.55);
      --input-fill: rgba(0, 0, 0, 0.4);
      --card-base: rgba(255, 255, 255, 0.06);
      --scroll-thumb: rgba(255, 255, 255, 0.2);
    }

    :root[data-theme="light"] {
      --bg-deep: #F2F2F7;
      --glass-surface: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-highlight: rgba(255, 255, 255, 0.4);
      --text-main: #1D1D1F;
      --text-sub: rgba(0, 0, 0, 0.5);
      --input-fill: rgba(0, 0, 0, 0.05);
      --card-base: #FFFFFF;
      --scroll-thumb: rgba(0, 0, 0, 0.15);
    }

    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0; padding: 0;
      background: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      transition: background 0.5s var(--ease-smooth);
      overflow-x: hidden;
    }

    .ambient-glow {
      position: fixed; width: 100vw; height: 100vh; top: 0; left: 0; z-index: -1;
      background: 
        radial-gradient(circle at 20% 20%, rgba(66, 133, 244, 0.15), transparent 50%),
        radial-gradient(circle at 80% 30%, rgba(234, 67, 53, 0.12), transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(52, 168, 83, 0.12), transparent 60%),
        radial-gradient(circle at 70% 90%, rgba(251, 188, 5, 0.12), transparent 50%);
      filter: blur(100px); pointer-events: none;
    }

    /* === 布局核心：统一宽度 === */
    .container {
      /* 上下统一使用 92vw，不再有内部限制 */
      width: 92vw;
      max-width: 92vw;
      margin: 0 auto; 
      padding: 40px 0;
      display: flex; flex-direction: column; gap: 24px;
    }

    .glass-panel {
      background: var(--glass-surface);
      backdrop-filter: blur(30px) saturate(140%);
      -webkit-backdrop-filter: blur(30px) saturate(140%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 1px 0 inset var(--glass-highlight), 0 24px 48px -12px rgba(0,0,0,0.1);
      border-radius: 28px;
      padding: 32px;
      position: relative;
      transition: transform 0.3s var(--ease-smooth);
      width: 100%; /* 确保面板撑满容器 */
    }

    .header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
    h1 {
      font-size: 28px; font-weight: 700; margin: 0; letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--c-blue), var(--c-red));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* === 操作栏平衡优化 === */
    .action-bar { 
      display: flex; gap: 16px; align-items: center; width: 100%; 
      flex-wrap: wrap; /* 小屏幕允许换行 */
    }
    
    /* 让输入框自动填充中间的空隙，连接左右两侧 */
    .input-pill {
      background: var(--input-fill); border: 1px solid transparent;
      height: 52px; padding: 0 20px; border-radius: 99px;
      color: var(--text-main); font-family: inherit; font-size: 14px;
      
      /* 关键改动：Flex Grow */
      flex: 1; 
      min-width: 200px; /* 防止过窄 */
      
      transition: all 0.3s var(--ease-smooth);
    }
    .input-pill:focus { 
      background: var(--bg-deep); border-color: var(--c-blue); 
      box-shadow: 0 0 0 4px rgba(66, 133, 244, 0.25); outline: none; transform: translateY(-1px);
    }

    /* 按钮样式维持不变 */
    .btn {
      border: none; padding: 0 24px; height: 52px; border-radius: 99px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      position: relative; overflow: hidden; white-space: nowrap; /* 防止文字换行 */
      transition: all 0.4s var(--ease-elastic);
      flex-shrink: 0; /* 防止按钮被压缩 */
    }
    .btn:hover:not(:disabled) { transform: translateY(-3px) scale(1.03); }
    .btn:active:not(:disabled) { transform: translateY(1px) scale(0.95); transition-duration: 0.1s; }

    .btn-primary {
      background: linear-gradient(135deg, var(--c-blue), #3b78e7); color: white;
      box-shadow: 0 8px 20px -6px rgba(66, 133, 244, 0.4), 0 2px 4px -1px rgba(66, 133, 244, 0.2) inset;
    }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 16px 32px -8px rgba(66, 133, 244, 0.6), 0 4px 8px -2px rgba(255, 255, 255, 0.2) inset; }

    .btn-secondary { background: var(--input-fill); color: var(--text-main); border: 1px solid transparent; }
    .btn-secondary:hover:not(:disabled) { background: var(--glass-border); border-color: rgba(255,255,255,0.1); box-shadow: 0 8px 24px -6px rgba(0,0,0,0.15); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; filter: grayscale(0.8); }

    .btn-overlay-ready {
      background: linear-gradient(135deg, var(--c-green), #2d9147) !important; color: white !important;
      box-shadow: 0 8px 20px -6px rgba(52, 168, 83, 0.4) !important;
    }
    .btn-overlay-ready:hover:not(:disabled) { box-shadow: 0 16px 32px -8px rgba(52, 168, 83, 0.6) !important; }

    .icon-btn {
      width: 44px; height: 44px; border-radius: 50%;
      border: 1px solid var(--glass-border); background: var(--card-base); color: var(--text-main);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      transition: all 0.4s var(--ease-elastic);
    }
    .icon-btn:hover { transform: rotate(20deg) scale(1.15); background: var(--text-main); color: var(--bg-deep); }
    .icon-btn:active { transform: scale(0.9); }

    /* 步骤条自适应 */
    .steps-container { display: flex; gap: 16px; margin-bottom: 32px; width: 100%; }
    .step-card {
      flex: 1; /* 平分宽度 */
      background: var(--input-fill); border-radius: 20px; padding: 16px;
      display: flex; align-items: center; gap: 14px; justify-content: center; /* 居中内容 */
      border: 1px solid transparent; transition: 0.3s var(--ease-smooth);
    }
    .step-card:hover { background: var(--card-base); border-color: var(--glass-border); transform: translateY(-2px); }
    .step-icon {
      width: 42px; height: 42px; border-radius: 14px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; color: white;
    }
    .s-1 { background: var(--c-blue); } .s-2 { background: var(--c-red); } .s-3 { background: var(--c-green); }
    .step-text h3 { margin: 0 0 2px 0; font-size: 14px; font-weight: 600; white-space: nowrap; }
    .step-text p { margin: 0; font-size: 12px; color: var(--text-sub); white-space: nowrap; }

    .status-bar {
      margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--glass-border);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; color: var(--text-sub); width: 100%;
    }
    .file-tag {
      background: var(--card-base); padding: 6px 12px; border-radius: 10px;
      color: var(--text-main); font-weight: 500; display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid var(--glass-border);
    }

    /* === 预览区 (保持全宽) === */
    .preview-layout { display: flex; gap: 24px; width: 100%; }
    .preview-section { flex: 1; min-width: 0; /* 防止Flex子项溢出 */ display: flex; flex-direction: column; }
    
    .section-title {
      font-size: 15px; font-weight: 600; margin-bottom: 16px;
      color: var(--text-sub); display: flex; justify-content: space-between; padding: 0 4px;
    }

    .grid-scroller {
      max-height: 75vh; min-height: 400px;
      overflow-y: auto; overflow-x: hidden;
      padding-right: 8px; padding-bottom: 8px; padding-top: 4px; padding-left: 4px;
      scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent;
    }
    .grid-scroller::-webkit-scrollbar { width: 8px; }
    .grid-scroller::-webkit-scrollbar-track { background: transparent; }
    .grid-scroller::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; }

    .grid-container {
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
      gap: 20px; 
    }

    .card {
      background: var(--card-base); border-radius: 18px; padding: 10px;
      position: relative; cursor: pointer; border: 2px solid transparent;
      transition: all 0.3s var(--ease-elastic);
    }
    .card canvas { width: 100%; height: auto; display: block; border-radius: 12px; transition: opacity 0.2s; }
    .card:hover {
      background: var(--glass-highlight); transform: translateY(-6px) scale(1.05);
      box-shadow: 0 16px 30px -10px rgba(0,0,0,0.2); z-index: 2;
    }
    .card:active { transform: scale(0.95); }

    .card.selected { border-color: var(--c-blue); background: rgba(66, 133, 244, 0.08); box-shadow: 0 0 0 4px rgba(66, 133, 244, 0.15); }
    .card.target-selected { border-color: var(--c-green); background: rgba(52, 168, 83, 0.08); box-shadow: 0 0 0 4px rgba(52, 168, 83, 0.15); }

    .badge {
      position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 50%;
      background: var(--c-blue); color: white; display: flex; align-items: center; justify-content: center;
      transform: scale(0); transition: transform 0.4s var(--ease-elastic);
      z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .card.selected .badge { transform: scale(1); }
    .target-badge { background: var(--c-green); }
    .card.target-selected .badge { transform: scale(1); }
    .card-label { text-align: center; font-size: 12px; margin-top: 10px; color: var(--text-sub); font-weight: 600; }
    .card.selected .card-label { color: var(--c-blue); }
    .card.target-selected .card-label { color: var(--c-green); }

    .hidden { display: none !important; }
    input[type="file"] { display: none; }
    
    /* 移动端适配调整 */
    @media (max-width: 768px) {
      .preview-layout { flex-direction: column; }
      .steps-container { flex-direction: column; }
      .action-bar { gap: 12px; }
      .input-pill { width: 100%; order: 3; } /* 移动端输入框换行 */
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";</script>
</head>
<body>

  <div class="ambient-glow"></div>

  <div class="container">
    
    <div class="glass-panel">
      <div class="header-row">
        <h1>PDF Stamp → Highlight</h1>
        <button class="icon-btn" id="toggle-theme" title="切换主题">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>

      <div class="steps-container">
        <div class="step-card">
          <div class="step-icon s-1">1</div>
          <div class="step-text"><h3>导入源文件</h3><p>选择包含印章/批注的 PDF</p></div>
        </div>
        <div class="step-card">
          <div class="step-icon s-2">2</div>
          <div class="step-text"><h3>选择与甄别</h3><p>点击预览图或输入页码</p></div>
        </div>
        <div class="step-card">
          <div class="step-icon s-3">3</div>
          <div class="step-text"><h3>转换 / 覆盖</h3><p>生成高亮版本或合并</p></div>
        </div>
      </div>

      <div class="action-bar">
        <label class="btn btn-primary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span id="source-filename">选择 PDF 源文件</span>
          <input id="file-input" type="file" accept="application/pdf">
        </label>
        
        <input id="custom-pages" class="input-pill" type="text" placeholder="页码范围 (如 1, 3-5)">
        
        <button id="process-selected" class="btn btn-secondary" disabled>处理选中页</button>
        <button id="process-all" class="btn btn-secondary" disabled>处理全部</button>
      </div>

      <div style="height: 1px; background: var(--glass-border); margin: 28px 0;"></div>

      <div class="action-bar">
        <label class="btn btn-secondary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 12l8-8M12 12H4m8 0v8"/></svg>
          <span id="target-filename">选择覆盖目标 PDF</span>
          <input id="target-file-input" type="file" accept="application/pdf">
        </label>
        
        <input id="target-pages" class="input-pill" type="text" placeholder="目标页码 (必填)">
        <input id="source-pages" class="input-pill" type="text" placeholder="来源页码 (可选)" style="flex: 0.8"> <button id="process-overlay" class="btn btn-secondary" disabled>转换并覆盖</button>
      </div>

      <div class="status-bar">
        <div style="display:flex; gap:12px;">
          <div id="file-tag-source" class="file-tag hidden">
            <span style="width:8px; height:8px; background:var(--c-blue); border-radius:50%"></span>
            <span id="label-source-name">source.pdf</span>
            <span style="opacity:0.3">|</span>
            <span id="label-source-count" style="color:var(--text-sub)">0p</span>
          </div>
          <div id="file-tag-target" class="file-tag hidden">
            <span style="width:8px; height:8px; background:var(--c-green); border-radius:50%"></span>
            <span id="label-target-name">target.pdf</span>
          </div>
        </div>
        <div id="status-text">等待文件...</div>
      </div>
    </div>

    <div class="preview-layout">
      <div class="glass-panel preview-section" id="panel-source" style="display:none">
        <div class="section-title">
          <span>源文件预览 (点击选择)</span>
          <span style="color:var(--c-blue)" id="hint-source"></span>
        </div>
        <div class="grid-scroller">
          <div id="grid-source" class="grid-container"></div>
        </div>
      </div>

      <div class="glass-panel preview-section" id="panel-target" style="display:none">
        <div class="section-title">
          <span>覆盖目标预览 (点击选择)</span>
          <span style="color:var(--c-green)" id="hint-target"></span>
        </div>
        <div class="grid-scroller">
          <div id="grid-target" class="grid-container"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    /* 逻辑保持不变 */
    const els = {
      fileInput: document.getElementById('file-input'),
      targetInput: document.getElementById('target-file-input'),
      gridSource: document.getElementById('grid-source'),
      gridTarget: document.getElementById('grid-target'),
      panelSource: document.getElementById('panel-source'),
      panelTarget: document.getElementById('panel-target'),
      status: document.getElementById('status-text'),
      btnSelected: document.getElementById('process-selected'),
      btnAll: document.getElementById('process-all'),
      btnOverlay: document.getElementById('process-overlay'),
      inputCustom: document.getElementById('custom-pages'),
      inputTarget: document.getElementById('target-pages'),
      inputSource: document.getElementById('source-pages'),
      labelSource: document.getElementById('source-filename'),
      labelTarget: document.getElementById('target-filename'),
      tagSource: document.getElementById('file-tag-source'),
      tagNameSource: document.getElementById('label-source-name'),
      tagCountSource: document.getElementById('label-source-count'),
      tagTarget: document.getElementById('file-tag-target'),
      tagNameTarget: document.getElementById('label-target-name'),
      hintSource: document.getElementById('hint-source'),
      hintTarget: document.getElementById('hint-target'),
      themeToggle: document.getElementById('toggle-theme')
    };

    let state = {
      sourceFile: null, targetFile: null, sourceDoc: null, targetDoc: null,
      selSource: new Set(), selTarget: new Set()
    };

    (function initTheme() {
      const saved = localStorage.getItem('theme');
      const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersLight ? 'light' : 'dark'));
    })();

    els.themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    els.fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      state.sourceFile = file;
      els.labelSource.innerText = file.name;
      els.tagNameSource.innerText = file.name;
      els.tagSource.classList.remove('hidden');
      updateStatus('正在解析源文件...', 'loading');
      controls(false);
      try {
        const ab = await file.arrayBuffer();
        state.sourceDoc = await pdfjsLib.getDocument({ data: ab }).promise;
        els.tagCountSource.innerText = state.sourceDoc.numPages + '页';
        state.selSource.clear();
        els.inputCustom.value = '';
        els.gridSource.innerHTML = '';
        els.panelSource.style.display = 'flex';
        els.hintSource.innerText = `${state.sourceDoc.numPages} 页`;
        await renderGrid(state.sourceDoc, els.gridSource, false);
        updateStatus('源文件就绪', 'success');
        controls(true);
      } catch (err) { console.error(err); updateStatus('无法读取文件', 'error'); }
    });

    els.targetInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      state.targetFile = file || null;
      if (!file) return;
      els.labelTarget.innerText = file.name;
      els.tagNameTarget.innerText = file.name;
      els.tagTarget.classList.remove('hidden');
      updateStatus('正在解析目标文件...', 'loading');
      controls(false);
      try {
        const ab = await file.arrayBuffer();
        state.targetDoc = await pdfjsLib.getDocument({ data: ab }).promise;
        state.selTarget.clear();
        els.inputTarget.value = '';
        els.gridTarget.innerHTML = '';
        els.panelTarget.style.display = 'flex';
        els.hintTarget.innerText = `${state.targetDoc.numPages} 页`;
        await renderGrid(state.targetDoc, els.gridTarget, true);
        updateStatus('目标文件就绪', 'success');
      } catch (err) { updateStatus('目标文件解析失败', 'error'); } finally { controls(true); }
    });

    els.inputCustom.addEventListener('input', (e) => {
      state.selSource = parseRange(e.target.value, state.sourceDoc?.numPages || 0);
      syncVisuals(els.gridSource, state.selSource, false);
      updateBtnState();
    });

    els.inputTarget.addEventListener('input', (e) => {
      state.selTarget = parseRange(e.target.value, state.targetDoc?.numPages || 0);
      syncVisuals(els.gridTarget, state.selTarget, true);
      updateBtnState();
    });

    els.btnSelected.addEventListener('click', () => process(true));
    els.btnAll.addEventListener('click', () => process(false));
    els.btnOverlay.addEventListener('click', processOverlay);

    async function renderGrid(doc, container, isTarget) {
      container.innerHTML = '';
      for (let i = 1; i <= doc.numPages; i++) {
        const page = await doc.getPage(i);
        const viewport = page.getViewport({ scale: 0.15 });
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.p = i;
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = viewport.width; canvas.height = viewport.height;
        await page.render({ canvasContext: ctx, viewport }).promise;
        const badge = document.createElement('div');
        badge.className = isTarget ? 'badge target-badge' : 'badge';
        badge.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
        const label = document.createElement('div');
        label.className = 'card-label'; label.innerText = i;
        card.appendChild(badge); card.appendChild(canvas); card.appendChild(label);
        card.addEventListener('click', () => {
          const set = isTarget ? state.selTarget : state.selSource;
          if (set.has(i)) set.delete(i); else set.add(i);
          if (isTarget) { els.inputTarget.value = setToStr(set); syncVisuals(container, set, true); }
          else { els.inputCustom.value = setToStr(set); syncVisuals(container, set, false); }
          updateBtnState();
        });
        container.appendChild(card);
      }
    }

    function syncVisuals(container, set, isTarget) {
      for (let card of container.children) {
        const p = parseInt(card.dataset.p);
        const cls = isTarget ? 'target-selected' : 'selected';
        if (set.has(p)) card.classList.add(cls); else card.classList.remove(cls);
      }
    }

    function controls(enabled) {
      els.btnAll.disabled = !enabled; els.inputCustom.disabled = !enabled;
      els.inputTarget.disabled = !enabled; els.inputSource.disabled = !enabled;
      updateBtnState();
    }

    function updateBtnState() {
      if (!state.sourceFile) { els.btnSelected.disabled = true; els.btnOverlay.disabled = true; return; }
      const hasSel = state.selSource.size > 0;
      els.btnSelected.disabled = !hasSel;
      els.btnSelected.innerHTML = hasSel ? `处理选中 (${state.selSource.size})` : '处理选中页';
      if(hasSel) { els.btnSelected.classList.add('btn-primary'); els.btnSelected.classList.remove('btn-secondary'); }
      else { els.btnSelected.classList.remove('btn-primary'); els.btnSelected.classList.add('btn-secondary'); }

      const readyOverlay = state.targetFile && (state.selTarget.size > 0 || els.inputTarget.value.trim());
      els.btnOverlay.disabled = !readyOverlay;
      if (readyOverlay) {
        els.btnOverlay.classList.add('btn-overlay-ready');
        els.btnOverlay.classList.remove('btn-secondary');
      } else {
        els.btnOverlay.classList.remove('btn-overlay-ready');
        els.btnOverlay.classList.add('btn-secondary');
      }
    }

    function updateStatus(msg, type) {
      els.status.innerHTML = msg;
      els.status.style.color = type === 'error' ? 'var(--c-red)' : type === 'success' ? 'var(--c-green)' : 'var(--text-sub)';
    }

    function parseRange(str, max) {
      const s = new Set();
      if (!str) return s;
      const parts = str.split(/[,，\s]+/);
      parts.forEach(p => {
        if (p.includes('-')) {
          const [a, b] = p.split('-').map(Number);
          if (a && b) { const min = Math.min(a,b), high = Math.max(a,b); for(let i=min; i<=high; i++) if(i<=max) s.add(i); }
        } else { const n = Number(p); if (n && n<=max) s.add(n); }
      });
      return s;
    }

    function setToStr(set) { return Array.from(set).sort((a,b)=>a-b).join(', '); }

    async function process(selectedOnly) {
      if(!state.sourceFile) return;
      updateStatus('正在处理...', 'loading');
      const fd = new FormData();
      fd.append('file', state.sourceFile);
      if(selectedOnly && state.selSource.size > 0) fd.append('pages', setToStr(state.selSource));
      setTimeout(() => { alert('前端演示模式：请求已构建。'); updateStatus('处理完成', 'success'); }, 800);
    }

    async function processOverlay() {
      if(!state.sourceFile || !state.targetFile) return;
      updateStatus('正在合并...', 'loading');
      setTimeout(() => { alert('前端演示模式：覆盖请求已构建。'); updateStatus('合并完成', 'success'); }, 800);
    }
  </script>
</body>
</html>
